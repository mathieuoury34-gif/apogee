# Publication d’Apogée à chaque envoi sur la branche main :
#  1. tests des calculs + contrôle des types + construction de l'app web ;
#  2. mise en ligne sur GitHub Pages (PC, iPhone, Android : https://<compte>.github.io/<dépôt>/) ;
#  3. construction de l'APK Android (Capacitor + module Health Connect), publiée dans la release « apk ».
name: Publier

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publier
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4

  apk:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-shell
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # le SDK Android est déjà installé sur les machines ubuntu-latest de GitHub (ANDROID_HOME)
      - run: npm install --no-audit --no-fund
      - name: Adresse de l'app web
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then echo "SITE_URL=https://$OWNER.github.io/" >> "$GITHUB_ENV"; else echo "SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"; fi
      - run: npm run configure
      - run: npx cap add android
      - run: npm run patch
      - run: npx cap sync android
      - name: Construction de l'APK
        working-directory: android-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../apogee.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apogee-apk
          path: apogee.apk
      - name: Release « apk » (lien de téléchargement stable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Apogée — APK Android
          body: |
            APK construit automatiquement depuis ${{ github.sha }}.
            Installer « apogee.apk » sur le téléphone (autoriser l'installation depuis le navigateur).
            L'interface se met à jour seule avec le site : réinstaller l'APK n'est utile que si le module natif change.
          files: apogee.apk
          make_latest: true
