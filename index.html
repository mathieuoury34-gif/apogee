<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apogée</title>
  <meta name="description" content="Suivi personnel d’entraînement multisport : natation, vélo, course, renforcement.">
  <meta name="theme-color" content="#16181B">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=(localStorage.getItem('apogee:theme')||localStorage.getItem('quadra:theme')||localStorage.getItem('ironapp:theme'));if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apogée">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- Polices hébergées avec l'app (plus d'attente d'un serveur tiers au démarrage) -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/open-sans-latin-400-normal.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/montserrat-latin-700-normal.woff2">
  <style>
    @font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
    @font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
    @font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
    @font-face{font-family:"Open Sans";font-weight:400;font-display:swap;src:url(fonts/open-sans-latin-400-normal.woff2) format("woff2")}
    @font-face{font-family:"Open Sans";font-weight:600;font-display:swap;src:url(fonts/open-sans-latin-600-normal.woff2) format("woff2")}
    @font-face{font-family:"Open Sans";font-weight:700;font-display:swap;src:url(fonts/open-sans-latin-700-normal.woff2) format("woff2")}
    @font-face{font-family:"Cormorant Garamond";font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format("woff2")}
    /* Écran de démarrage : dessiné avant tout le reste, sur le fond encre du logo */
    :root:not(.app-ready){background:#16181B}
    body{margin:0}
    #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#16181B;transition:opacity .3s ease}
    #splash.out{opacity:0;pointer-events:none}
    /* Animations limitées à transform et opacity, sur des éléments HTML à part : le navigateur les anime sur le processeur graphique,
       sans attendre le programme de la page (sur téléphone, le chargement de l'app occupait le fil principal et l'animation saccadait). */
    #splash .logo{position:relative;width:128px;height:128px}
    #splash .m{position:absolute;inset:0;width:100%;height:100%;overflow:visible;opacity:0;will-change:transform,opacity;animation:sp-in .7s cubic-bezier(.2,.7,.2,1) forwards}
    #splash .m1{transform-origin:20% 79%;animation-delay:.1s}
    #splash .m2{transform-origin:43% 56%;animation-delay:.35s}
    #splash .m3{transform-origin:71% 30%;animation-delay:.6s}
    #splash .glow{position:absolute;left:71%;top:30%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:radial-gradient(circle,rgba(240,166,30,.5) 0%,rgba(240,166,30,.18) 45%,rgba(240,166,30,0) 70%);opacity:0;will-change:opacity;animation:sp-glow 1.2s ease-in-out 1.3s infinite alternate}
    @keyframes sp-in{from{opacity:0;transform:translate3d(-9px,9px,0) scale(.7)}to{opacity:1;transform:translate3d(0,0,0) scale(1)}}
    @keyframes sp-glow{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion:reduce){#splash .m{opacity:1;animation:none}#splash .glow{animation:none}#splash{transition:none}}
  </style>
  <!-- Feuille de style non bloquante : l'écran de démarrage s'affiche sans l'attendre, et ne disparaît qu'une fois elle chargée -->
  <link rel="stylesheet" href="app.css" media="print" onload="this.media='all';window.__css&&window.__css()">
  <noscript><link rel="stylesheet" href="app.css"></noscript>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="logo">
      <i class="glow"></i>
      <svg class="m m1" viewBox="0 0 100 100" fill="none"><g transform="translate(-2 3)"><circle cx="22" cy="76" r="10" stroke="#ECE8E0" stroke-width="2.4"/><path d="M22 66A10 10 0 0 1 22 86A5.5 10 0 0 0 22 66Z" fill="#ECE8E0"/></g></svg>
      <svg class="m m2" viewBox="0 0 100 100" fill="none"><g transform="translate(-2 3)"><circle cx="45" cy="53" r="14" stroke="#ECE8E0" stroke-width="2.4"/><path d="M45 39A14 14 0 0 1 45 67Z" fill="#ECE8E0"/></g></svg>
      <svg class="m m3" viewBox="0 0 100 100" fill="none"><g transform="translate(-2 3)"><circle cx="73" cy="27" r="19" fill="#F0A61E"/></g></svg>
    </div>
  </div>
  <div id="root"></div>
  <noscript>Apogée a besoin de JavaScript.</noscript>
  <script>
    // Retire l'écran de démarrage quand l'app est prête (apogeeReady, appelé par l'app) ET que la feuille de style est chargée.
    (function () {
      var css = false, ready = false, done = false;
      // L'écran de démarrage reste au moins le temps de l'animation (trois lunes + pleine lune qui s'allume), même si l'app est prête avant.
      var MIN = 1700, t0 = Date.now();
      try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) MIN = 0; } catch (e) { /* ignoré */ }
      function go() {
        if (done || !(css && ready)) return;
        var wait = MIN - (Date.now() - t0);
        if (wait > 0) { setTimeout(go, wait); return; }
        done = true;
        var s = document.getElementById('splash');
        document.documentElement.classList.add('app-ready');
        if (s) { s.classList.add('out'); setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 400); }
      }
      // Dans l'APK : dès que le logo est dessiné, l'écran de lancement natif peut s'effacer (nouvelle tentative tant que le pont n'est pas prêt).
      function hideNative() {
        var tries = 0;
        (function t() {
          try {
            var c = window.Capacitor;
            if (!c) return; // navigateur : pas d'écran natif à retirer
            var p = c.Plugins && c.Plugins.ApogeeHealth;
            if (p && p.hideSplash) { p.hideSplash(); return; }
          } catch (e) { /* page web seule : rien à faire */ }
          if (++tries < 30) setTimeout(t, 100);
        })();
      }
      requestAnimationFrame(function () { requestAnimationFrame(hideNative); });
      window.__css = function () { css = true; go(); };
      window.apogeeReady = function () { ready = true; go(); };
      // filet de sécurité : jamais d'écran de démarrage bloqué
      setTimeout(function () { css = true; ready = true; go(); }, 8000);
    })();
  </script>
  <!-- modulepreload -->
  <script>
    // Le programme de l'app est téléchargé tout de suite (modulepreload) mais n'est exécuté qu'après le début de l'animation :
    // son analyse occupe le fil principal du téléphone et faisait saccader le logo. L'écran de démarrage dure de toute façon 1,7 s.
    (function () {
      var d = 800;
      try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) d = 0; } catch (e) { /* ignoré */ }
      setTimeout(function () { import('./app.js'); }, d);
    })();
  </script>
</body>
</html>
